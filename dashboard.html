function applyToolbarMode(tab){
  const tb = document.getElementById("toolbar");
  if(!tb) return;
  tb.classList.toggle("toolbar-minimal", tab === "anya" || tab === "pages");
  tb.classList.toggle("toolbar-all", tab === "all");
}
$$("nav.tabs button").forEach(b => b.addEventListener("click", e => {
  $$("nav.tabs button").forEach(x=>x.classList.remove("active"));
  $$("section").forEach(s=>s.classList.remove("active"));
  b.classList.add("active");
  $("#sec-"+b.dataset.tab).classList.add("active");
  state.activeTab = b.dataset.tab; saveState();
  applyToolbarMode(state.activeTab);
}));

["filterPlatform","filterStatus","filterMode"].forEach(id => {
  document.getElementById(id).addEventListener("change", () => { renderToday(); renderCal(); renderAll(); });
});

document.addEventListener("click", e => {
  const t = e.target.closest("button, a, [data-jump], [data-close-pm], [data-mark-published], [data-mark-unpublish], [data-anya-jump], [data-anya-open], [data-anya-prev], [data-anya-next], [data-anya-ready], [data-anya-del], [data-anya-del-confirm], [data-anya-restore], [data-anya-add]");
  if(!t) return;
  if(t.matches("[data-anya-del]")){
    e.preventDefault(); e.stopPropagation();
    const id = t.dataset.anyaDel;
    const p = state.posts[id]; if(!p) return;
    openDeleteAnyaModal(p);
    return;
  }
  if(t.matches("[data-anya-del-confirm]")){
    e.preventDefault();
    const id = t.dataset.anyaDelConfirm;
    const p = state.posts[id]; if(!p) return;
    const ri = rowIndexOf(p);
    if(state.anyaCurrentId === id){
      const list = anyaPosts().filter(x => x.id !== id);
      state.anyaCurrentId = list.length ? list[0].id : null;
    }
    p.status = "deleted"; saveState();
    if(ri) pushField(ri, "status", "deleted", 0);
    closePublishModal();
    renderAnya(); renderToday(); renderAll(); renderCal();
    flash("Пост перенесён в архив удалённых");
    return;
  }
  if(t.matches("[data-anya-restore]")){
    e.preventDefault(); e.stopPropagation();
    const id = t.dataset.anyaRestore;
    const p = state.posts[id]; if(!p) return;
    p.status = "draft"; saveState();
    const ri = rowIndexOf(p); if(ri) pushField(ri, "status", "draft", 0);
    state.anyaCurrentId = id;
    renderAnya(); renderToday(); renderAll(); renderCal();
    flash("Пост восстановлен");
    return;
  }
  if(t.matches("[data-anya-add]")){
    e.preventDefault();
    const cur = state.anyaCurrentId ? state.posts[state.anyaCurrentId] : null;
    const baseDate = cur && cur.datetime ? new Date(cur.datetime) : new Date();
    baseDate.setDate(baseDate.getDate()+1);
    baseDate.setHours(12,0,0,0);
    const iso = `${baseDate.getFullYear()}-${pad(baseDate.getMonth()+1)}-${pad(baseDate.getDate())}T${pad(baseDate.getHours())}:${pad(baseDate.getMinutes())}:00`;
    const draft = { platform:"Instagram", platforms:"Instagram", mode:"В ленту", title:"Новый пост",
                    datetime: iso, text:"", media:"", cover:"", hashtags:"", owner:"Аня", status:"draft", checks:{}};
    (async () => {
      let id;
      if(isOnline()){

  if(t.matches("[data-anya-jump]")){
    const prev = state.anyaCurrentId;
    state.anyaCurrentId = t.dataset.anyaJump;
    if(window.matchMedia("(max-width:720px)").matches){ state.anyaListOpen = false; }
    saveState(); renderAnya();
    if(prev && prev !== state.anyaCurrentId) savePost(prev);
    return;
  } else if(t.matches("[data-anya-prev]")){
    const posts = anyaPosts();
    const idx = posts.findIndex(x=>x.id===state.anyaCurrentId);
    if(idx>0){
      const prev = state.anyaCurrentId;
      state.anyaCurrentId = posts[idx-1].id; saveState(); renderAnya();
      if(prev) savePost(prev);
    }
    return;
  } else if(t.matches("[data-anya-next]")){
    const posts = anyaPosts();
    const idx = posts.findIndex(x=>x.id===state.anyaCurrentId);
    const nextUn = nextUnfilledId(state.anyaCurrentId);
    const prev = state.anyaCurrentId;
    if(nextUn){ state.anyaCurrentId = nextUn; }
    else if(idx>=0 && idx<posts.length-1){ state.anyaCurrentId = posts[idx+1].id; }
    else if(posts.length){ state.anyaCurrentId = posts[0].id; }
    saveState(); renderAnya();
    if(prev && prev !== state.anyaCurrentId) savePost(prev);
    return;
  } else if(t.matches("[data-anya-ready]")){
    const id = t.dataset.anyaReady;
    const p = state.posts[id]; if(!p) return;

    return;
  }
  if(t.matches(".publish-btn")){
    openPublishModal(t.dataset.id);
  } else if(t.matches("[data-pm-platform]")){
    const p = state.posts[t.dataset.id]; if(!p) return;
    renderPublishModal(p, t.dataset.pmPlatform);
  } else if(t.matches(".pm-copy-all")){
    const p = state.posts[t.dataset.id]; copy(buildFullTextFor(p, t.dataset.platform||"Instagram"));
  } else if(t.matches(".pm-copy-text")){
    const p = state.posts[t.dataset.id]; const c = contentForPlatform(p, t.dataset.platform||"Instagram"); copy((c.text||"").trim());
  } else if(t.matches(".pm-copy-tags")){
    const p = state.posts[t.dataset.id]; const c = contentForPlatform(p, t.dataset.platform||"Instagram"); copy((c.hashtags||state.settings.baseHashtags||"").trim());
  } else if(t.matches(".pm-open-all")){
    try{
      const urls = JSON.parse(t.dataset.urls);
      urls.forEach((u,i)=> setTimeout(()=> window.open(u, "_blank", "noopener"), i*120));
    }catch(err){ alert("Не удалось открыть ссылки: "+err.message); }
  } else if(t.matches(".pm-download-zip")){
    const p = state.posts[t.dataset.id]; if(!p) return;
    downloadMediaZip(p, t.dataset.platform || "Instagram", t);
  } else if(t.matches(".pm-ig-publish")){
    igPublishConfirm(t.dataset.id);
  } else if(t.matches(".pm-ig-confirm")){
    igPublishNow(t.dataset.id, t);
  } else if(t.matches(".pm-ig-cancel")){
    igPublishClearStatus();
  } else if(t.matches("[data-close-pm]")){
    closePublishModal();
  } else if(t.matches("[data-mark-published]")){
    const id = t.dataset.markPublished;
    const p = state.posts[id]; if(!p) return;
    p.status = "published"; saveState(); render();
    const ri = rowIndexOf(p); if(ri) pushField(ri, "status", "published", 0);
    closePublishModal(); flash("Помечено как опубликовано");
  } else if(t.matches("[data-mark-unpublish]")){
    const id = t.dataset.markUnpublish;
    const p = state.posts[id]; if(!p) return;
    p.status = "ready"; saveState(); render();
    const ri = rowIndexOf(p); if(ri) pushField(ri, "status", "ready", 0);
    closePublishModal(); flash("Возвращено в «Готов»");
  } else if(t.matches(".copy-text")){
    const p = state.posts[t.dataset.id]; copy(buildFullText(p));
  } else if(t.matches(".copy-tags")){
    const p = state.posts[t.dataset.id];
    copy((p.hashtags||state.settings.baseHashtags||"").trim());
  } else if(t.matches(".del-post")){

      delete state.posts[t.dataset.id]; saveState(); render();

const previewDebounce = new Map();
function refreshPreview(id, kind, value, sufx){
  const suff = sufx || "";
  const key = id+"|"+kind+"|"+suff;
  if(previewDebounce.has(key)) clearTimeout(previewDebounce.get(key));
  previewDebounce.set(key, setTimeout(()=>{
    previewDebounce.delete(key);
    refreshPreviewImmediate(id, kind, value, suff);
  }, 350));
}
function fieldKind(field){
  if(field === "cover" || field.startsWith("cover_")) return {kind:"cover", sufx: field.length>5 ? field.slice(5) : ""};
  if(field === "media" || field.startsWith("media_")) return {kind:"media", sufx: field.length>5 ? field.slice(5) : ""};
  return null;
}

    const field = t.dataset.field;
    if(field === "datetime-date" || field === "datetime-time"){
      const cur = p.datetime || "";

      saveState();

      updateAnyaProgressLight();
      return;
    }
    p[field] = t.value; saveState();
    markPostDirty(p.id, field);

      refreshPreview(p.id, fk.kind, t.value, fk.sufx);

    if(["text","media","cover","title"].includes(field)){
      updateAnyaProgressLight();
    }
    if(field === "notes"){

      if(block) block.classList.toggle("filled", !!t.value.trim());

    state.profiles[plat][field] = value;

  }
});

/* ===== LIGHTBOX ===== */
let _lb = {items:[], idx:0, ctx:null};
function bigPreviewUrl(rawUrl){
  const u = String(rawUrl||"").trim().split("#")[0];
  if(!u) return null;
  const id = extractDriveId(u);
  if(id) return `https://drive.google.com/thumbnail?id=${id}&sz=w2000`;
  if(/^https?:\/\/.+\.(jpe?g|png|gif|webp|avif|bmp|mp4|webm|mov)(\?.*)?$/i.test(u)) return u;
  return null;
}
function isVideoUrl(rawUrl){
  return /\.(mp4|webm|mov|m4v)(#|$|\?)/i.test(String(rawUrl||"").split("#")[0]);
}
function openLightbox(items, idx, ctx){
  _lb = {items: items.filter(it => bigPreviewUrl(it.url)), idx: 0, ctx: ctx || null};
  if(!_lb.items.length) return;
  _lb.idx = Math.max(0, Math.min(idx||0, _lb.items.length-1));
  $("#lightbox").classList.add("show");
  renderLightbox();
}
function renderLightbox(){
  const stage = $("#lbStage");
  const it = _lb.items[_lb.idx]; if(!it){ closeLightbox(); return; }
  const big = bigPreviewUrl(it.url);
  const name = fileLabel(it);
  const sz = fmtSize(it.size);
  const isVid = isVideoUrl(it.url);
  const media = isVid
    ? `<video src="${escape(it.url)}" controls autoplay></video>`
    : `<img src="${escape(big)}" alt="${escape(name)}" onerror="this.outerHTML='<div class=lb-spinner>Не получилось загрузить превью. <a href=\\''+this.getAttribute('data-orig')+'\\' target=_blank rel=noopener>Открыть оригинал</a></div>'" data-orig="${escape(it.url)}">`;
  const nav = _lb.items.length > 1
    ? `<button class="lb-nav lb-prev" data-lb-prev title="Назад (←)">‹</button>
       <button class="lb-nav lb-next" data-lb-next title="Вперёд (→)">›</button>
       <div class="lb-counter">${_lb.idx+1} / ${_lb.items.length}</div>`
    : "";
  const delBtn = _lb.ctx ? `<button class="lb-action" data-lb-delete title="Убрать из поста (файл в Drive останется)">🗑 Удалить</button>` : "";
  stage.innerHTML = `
    <button class="lb-close" data-lb-close title="Закрыть (Esc)">✕</button>
    ${nav}
    ${media}
    <div class="lb-info">
      <span class="lb-name">${escape(name)}</span>
      ${sz?`<span class="lb-size">${escape(sz)}</span>`:""}
      <a href="${escape(it.url)}" target="_blank" rel="noopener">↗ Оригинал</a>
      ${delBtn}
    </div>
  `;
}
function closeLightbox(){ $("#lightbox").classList.remove("show"); $("#lbStage").innerHTML = ""; _lb.ctx = null; }
function lbNext(){ if(!_lb.items.length) return; _lb.idx = (_lb.idx+1) % _lb.items.length; renderLightbox(); }
function lbPrev(){ if(!_lb.items.length) return; _lb.idx = (_lb.idx-1+_lb.items.length) % _lb.items.length; renderLightbox(); }
async function lbDelete(){
  const ctx = _lb.ctx; if(!ctx){ alert("Не из этого окна — удалите через крестик на превью."); return; }
  if(!confirm("Убрать эту картинку из поста? Файл в Drive останется — можно вернуть.")) return;
  if(ctx.kind === "cover"){
    await removeCover(ctx.postId, ctx.sufx);
    closeLightbox();
  } else {
    const realIdx = _lb.idx;
    await removeMediaAt(ctx.postId, ctx.sufx, realIdx);
    _lb.items.splice(_lb.idx, 1);
    if(!_lb.items.length){ closeLightbox(); return; }
    _lb.idx = Math.min(_lb.idx, _lb.items.length-1);
    renderLightbox();
  }
}

/* ===== DRAG&DROP UPLOAD ===== */
const MAX_UPLOAD_BYTES = 30 * 1024 * 1024; // 30 MB предупреждение
const HARD_UPLOAD_BYTES = 50 * 1024 * 1024; // 50 MB жёсткий лимит Apps Script

function fileToBase64(file){
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => {
      const s = r.result || "";
      const i = String(s).indexOf(",");
      resolve(i >= 0 ? String(s).slice(i+1) : String(s));
    };
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

async function uploadFileToDrive(file){
  if(!isOnline()) throw new Error("Загрузка работает только в online-режиме (URL Apps Script в Настройках).");
  const folderUrl = (state.settings.mediaFolder||"").trim();
  if(!folderUrl) throw new Error("В Настройках не задана папка Drive — некуда грузить.");
  if(file.size > HARD_UPLOAD_BYTES) throw new Error(`Файл слишком большой (${(file.size/1024/1024).toFixed(1)} MB). Apps Script держит до 50 MB. Загрузите вручную в Drive и вставьте ссылку.`);
  if(file.size > MAX_UPLOAD_BYTES && !confirm(`Файл ${(file.size/1024/1024).toFixed(1)} MB — загрузка может занять минуту и иногда падает. Продолжить?`)) return null;
  const dataBase64 = await fileToBase64(file);
  setConn("⏳ Загрузка "+file.name+"…","warn");
  const res = await api({action:"upload", filename:file.name, mimeType:file.type||"application/octet-stream", folderUrl, dataBase64});
  setConn("✓ Загружено","ok");
  return res.url;
}

/* Общая загрузка списка файлов в конкретное поле поста */
async function ingestFiles(files, postId, kind /* "cover"|"media" */, sufx, uploaderEl){
  files = Array.from(files||[]); if(!files.length) return;
  const p = state.posts[postId]; if(!p){ alert("Не нашёл пост"); return; }
  const fieldName = kind + (sufx||"");
  const previewBoxId = (kind === "cover" ? "cover-preview-" : "media-preview-") + postId + (sufx||"");
  const previewBox = document.getElementById(previewBoxId);

  // Ставим ghost-плитки сразу — чтобы Аня видела, что файлы подхватились
  const ghosts = [];
  if(previewBox){
    if(kind === "cover"){
      // Для cover показываем одну ghost-карточку, заменяя текущий контент превью
      const g = ghostCoverCard(files[0]);
      previewBox.innerHTML = "";
      previewBox.appendChild(g);
      ghosts.push(g);
    } else {
      // Для media — добавляем все ghost-плитки в существующую сетку
      let grid = previewBox.querySelector(".media-preview");
      if(!grid){
        grid = document.createElement("div");
        grid.className = "media-preview";
        previewBox.innerHTML = "";
        previewBox.appendChild(grid);
      }
      files.forEach(file => {
        const g = ghostMediaItem(file);
        grid.appendChild(g);
        ghosts.push(g);
      });
    }
  }

  if(uploaderEl){
    uploaderEl.classList.add("uploading");
    const nameEl = uploaderEl.querySelector(".us-name");
    const progEl = uploaderEl.querySelector(".us-prog");
    if(nameEl) nameEl.textContent = files[0].name;
    if(progEl) progEl.textContent = files.length>1 ? `1 / ${files.length}` : "загружаем в Drive…";
  }

  try{
    for(let i=0;i<files.length;i++){
      const file = files[i];
      if(uploaderEl){
        const nameEl = uploaderEl.querySelector(".us-name");
        const progEl = uploaderEl.querySelector(".us-prog");
        if(nameEl) nameEl.textContent = file.name;
        if(progEl) progEl.textContent = files.length>1 ? `${i+1} / ${files.length}` : "загружаем в Drive…";
      }
      const rawUrl = await uploadFileToDrive(file);
      if(!rawUrl){
        // отмена через confirm — убираем ghost
        if(ghosts[i] && ghosts[i].parentNode) ghosts[i].remove();
        continue;
      }
      const url = withMeta(rawUrl, file.name, file.size);
      if(kind === "cover"){
        p[fieldName] = url;
      } else {
        const cur = (p[fieldName]||"").trim();
        p[fieldName] = cur ? cur + "\n" + url : url;
      }
      saveState();
      const ri = rowIndexOf(p); if(ri) pushField(ri, fieldName, p[fieldName], 0);
    }
    // Полный refresh превью — заменит все ghost-плитки реальными
    refreshPreviewImmediate(p.id, kind, p[fieldName], sufx||"");
    flash("Загружено в Drive");
    updateAnyaProgressLight();
    // Перерисуем фокус-карточку, чтобы обновить заголовки и кнопку «Готов»
    if(state.activeTab === "anya" && state.anyaCurrentId === postId) renderAnya();
  } catch(err){
    // При ошибке убираем ghost'ы, чтобы не висели
    ghosts.forEach(g => g.parentNode && g.remove());
    refreshPreviewImmediate(p.id, kind, p[fieldName], sufx||"");
    alert("Не удалось загрузить: " + err.message);
    setConn("⚠ "+err.message,"red");
  } finally {
    if(uploaderEl) uploaderEl.classList.remove("uploading");
  }
}

/* Достаём осмысленное имя файла из ссылки (для подписи в превью) */
function nameFromUrl(url){
  try{
    const u = new URL(String(url).split("#")[0]);
    const seg = decodeURIComponent(u.pathname.split("/").filter(Boolean).pop() || "");
    // у Drive путь вида /file/d/<id>/view — имя оттуда не достать, вернём пусто
    if(/^(view|edit|preview|d|file|open)$/i.test(seg)) return "";
    return /\.[a-z0-9]{2,4}$/i.test(seg) ? seg : "";
  }catch(_){ return ""; }
}

/* Добавление медиа по ручной ссылке (для файлов > 50 МБ, загруженных в Drive вручную) */
async function ingestLink(rawUrl, postId, kind /* "cover"|"media" */, sufx){
  const url = String(rawUrl||"").trim();
  if(!url) return;
  if(!/^https?:\/\//i.test(url)){ alert("Нужна прямая ссылка, начинающаяся с http:// или https://"); return; }
  const p = state.posts[postId]; if(!p){ alert("Не нашёл пост"); return; }
  const fieldName = kind + (sufx||"");
  const value = withMeta(url, nameFromUrl(url), 0);
  if(kind === "cover"){
    p[fieldName] = value;
  } else {
    const cur = (p[fieldName]||"").trim();
    p[fieldName] = cur ? cur + "\n" + value : value;
  }
  saveState();
  refreshPreviewImmediate(postId, kind, p[fieldName], sufx||"");
  const ri = rowIndexOf(p); if(ri) pushField(ri, fieldName, p[fieldName], 0);
  flash("Ссылка добавлена");
  updateAnyaProgressLight();
  if(state.activeTab === "anya" && state.anyaCurrentId === postId) renderAnya();
}

/* Немедленный (без debounce) refresh превью — нужен после загрузки, чтобы убрать ghost'ы.
   Одни и те же id могут встретиться в нескольких секциях (#sec-today / #sec-all / #sec-anya),
   поэтому обновляем ВСЕ совпавшие узлы, а не только первый. */
function refreshPreviewImmediate(id, kind, value, sufx){
  const suff = sufx || "";
  const prefix = kind === "media" ? "media-preview-" : kind === "cover" ? "cover-preview-" : null;
  if(!prefix) return;
  const html = kind === "media" ? renderMediaPreview(parseMediaList(value)) : renderCoverPreview(value);
  const sel = `[id="${prefix}${id}${suff}"]`;
  document.querySelectorAll(sel).forEach(el => { el.innerHTML = html; });
  if(!suff){
    document.querySelectorAll(`button.add-media-btn[data-anya-open="${id}"][data-add-kind="${kind}"]`).forEach(btn => {
      btn.hidden = !!value;
    });
  }
}

/* Удаление превью (✕) — крестик внутри <a>, поэтому ловим в capture-фазе и блокируем переход */
function parsePreviewId(elId, prefix){
  // elId вида "cover-preview-row-7_fb" или "media-preview-row-7" — возвращает {postId, sufx}
  if(!elId || !elId.startsWith(prefix)) return null;
  const rest = elId.slice(prefix.length); // "row-7" или "row-7_fb"
  const m = rest.match(/^(.+?)(_(fb|tg|tt|yt|vk))?$/);
  if(!m) return null;
  return {postId: m[1], sufx: m[2] || ""};
}
async function removeMediaAt(postId, sufx, idx){
  const p = state.posts[postId]; if(!p) return;
  const field = "media" + (sufx||"");
  const list = parseMediaList(p[field]);
  if(idx < 0 || idx >= list.length) return;
  list.splice(idx, 1);
  p[field] = serializeMediaList(list);
  saveState();
  refreshPreviewImmediate(postId, "media", p[field], sufx||"");
  const ri = rowIndexOf(p); if(ri) pushField(ri, field, p[field], 0);
  updateAnyaProgressLight();
  flash("Картинка убрана из поста");
}
async function removeCover(postId, sufx){
  const p = state.posts[postId]; if(!p) return;
  const field = "cover" + (sufx||"");
  p[field] = "";
  saveState();
  refreshPreviewImmediate(postId, "cover", "", sufx||"");
  const ri = rowIndexOf(p); if(ri) pushField(ri, field, "", 0);
  updateAnyaProgressLight();
  flash("Обложка убрана");
}

/* Свайп-жесты в lightbox: влево/вправо — листать, вниз — закрыть */
(function setupLightboxSwipes(){
  const lb = document.getElementById("lightbox");
  if(!lb) return;
  let sx=0, sy=0, dx=0, dy=0, tracking=false, isMulti=false;
  lb.addEventListener("touchstart", e => {
    if(e.touches.length !== 1){ tracking = false; isMulti = true; return; }
    isMulti = false;
    const t = e.touches[0];
    sx = t.clientX; sy = t.clientY; dx = 0; dy = 0;
    tracking = true;
  }, {passive:true});
  lb.addEventListener("touchmove", e => {
    if(!tracking) return;
    if(e.touches.length !== 1){ tracking = false; isMulti = true; return; }
    const t = e.touches[0];
    dx = t.clientX - sx;
    dy = t.clientY - sy;
  }, {passive:true});
  lb.addEventListener("touchend", () => {
    if(!tracking || isMulti) return;
    tracking = false;
    const ax = Math.abs(dx), ay = Math.abs(dy);
    // Свайп должен быть достаточно длинным
    if(ax < 40 && ay < 40) return;
    if(ax > ay){
      // Горизонтальный свайп — листаем
      if(dx < 0) lbNext(); else lbPrev();
    } else if(dy > 60){
      // Свайп вниз — закрываем
      closeLightbox();
    }
  });
})();
