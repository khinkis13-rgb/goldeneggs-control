<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Золотые яйца — пульт публикаций</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0d0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{
    --bg:#0f0d0a; --bg2:#171410; --panel:#1f1a14; --line:#2a2319;
    --gold:#e6b864; --gold-dim:#9a7c3f; --cream:#f4ecd8;
    --txt:#f4ecd8; --muted:#b9ad8f; --danger:#e07a5f; --ok:#7bbf6a; --warn:#e6c562;
    --radius:14px; --shadow:0 8px 24px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;font-size:15px;line-height:1.45}
  a{color:var(--gold);text-decoration:none}
  a:hover{text-decoration:underline}
  button,select,input,textarea{font-family:inherit;font-size:14px}
  textarea,input[type=text],input[type=url]{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:10px 12px;resize:vertical}
  textarea:focus,input:focus{outline:none;border-color:var(--gold-dim)}
  input[readonly]{background:rgba(31,26,20,.6);color:var(--muted);cursor:default}
  input[readonly]:focus{border-color:var(--line)}
  .btn{display:inline-flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:7px 12px;cursor:pointer;transition:.15s}
  .btn:hover{border-color:var(--gold-dim);color:var(--gold)}
  .btn.primary{background:var(--gold);color:#1b160c;border-color:var(--gold);font-weight:600}
  .btn.primary:hover{background:#f0c878;color:#1b160c}
  .btn.ghost{background:transparent}
  .btn.danger:hover{border-color:var(--danger);color:var(--danger)}
  .btn.save-btn{font-weight:600}
  .btn.save-btn:disabled{opacity:.55;cursor:default;color:var(--muted);border-color:var(--line);background:transparent}
  .btn.save-btn:disabled:hover{color:var(--muted);border-color:var(--line)}
  .btn.save-btn.dirty{background:var(--gold);color:#1b160c;border-color:var(--gold);box-shadow:0 0 0 2px rgba(230,184,100,.22)}
  .btn.save-btn.dirty:hover{background:#f0c878}
  .af-save-row{display:flex;justify-content:center;margin-top:6px}
  .af-save-row .btn.save-btn{min-width:200px;justify-content:center;padding:10px 18px;font-size:14px}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);font-size:12px;color:var(--muted)}
  .pill.gold{background:rgba(230,184,100,.12);border-color:var(--gold-dim);color:var(--gold)}
  .pill.ok{background:rgba(123,191,106,.12);border-color:#3e6532;color:var(--ok)}
  .pill.warn{background:rgba(230,197,98,.12);border-color:#7a6420;color:var(--warn)}
  .pill.red{background:rgba(224,122,95,.14);border-color:#7a3a2a;color:var(--danger)}
  .status-sel{background:var(--bg2);border:1px solid var(--line);border-radius:999px;color:var(--cream);padding:5px 30px 5px 14px;font-family:inherit;font-size:12px;font-weight:600;color-scheme:dark;-webkit-appearance:none;appearance:none;cursor:pointer;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10' fill='none'><path d='M2 4l3 3 3-3' stroke='%23b9ad8f' stroke-width='1.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");background-repeat:no-repeat;background-position:right 10px center;transition:.12s;line-height:1.3}
  .status-sel:hover{border-color:var(--gold-dim)}
  .status-sel:focus{outline:none;border-color:var(--gold-dim)}
  .status-sel[data-status="draft"]{color:var(--muted);border-color:var(--line)}
  .status-sel[data-status="review"]{color:var(--warn);background-color:rgba(230,197,98,.10);border-color:#7a6420}
  .status-sel[data-status="ready"]{color:var(--ok);background-color:rgba(123,191,106,.10);border-color:#3e6532}
  .status-sel[data-status="published"]{color:var(--gold);background-color:rgba(230,184,100,.12);border-color:var(--gold-dim)}
  .status-sel option{background:var(--panel);color:var(--cream)}

  /* layout */
  .wrap{max-width:1280px;margin:0 auto;padding:24px 22px 80px}
  header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:20px}
  .brand{display:flex;align-items:center;gap:14px}
  .brand .egg{height:48px;display:flex;align-items:center;filter:drop-shadow(0 4px 12px rgba(230,184,100,.45))}
  .brand .egg img{height:100%;width:auto;display:block}
  .brand h1{margin:0;font-size:22px;letter-spacing:.3px}
  .brand .sub{color:var(--muted);font-size:13px;margin-top:2px}
  .stats{display:flex;gap:10px;flex-wrap:wrap}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:110px}
  .stat .n{font-size:22px;font-weight:600;color:var(--gold)}
  .stat .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}

  nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
  nav.tabs button{background:transparent;border:none;color:var(--muted);padding:10px 14px;cursor:pointer;border-bottom:2px solid transparent;font-size:14px;white-space:nowrap}
  nav.tabs button.active{color:var(--gold);border-bottom-color:var(--gold)}
  nav.tabs button:hover{color:var(--cream)}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .toolbar.toolbar-minimal > select,
  .toolbar.toolbar-minimal > #btnAdd,
  .toolbar.toolbar-minimal > #btnMediaFolder{display:none !important}
  .toolbar:not(.toolbar-all) > #btnAdd{display:none}
  .toolbar.toolbar-all #btnAdd{display:inline-flex}
  #btnReload{font-size:18px;line-height:1;padding:7px 12px;min-width:38px;display:inline-flex;align-items:center;justify-content:center}
  #btnReload .ico{display:block;width:18px;height:18px;transform-origin:50% 50%}
  #btnReload.spin .ico{animation:spin 1s linear infinite}
  @keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
  .toolbar select{background:var(--bg2);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:7px 10px}
  .toolbar .spacer{flex:1}

  /* sections */
  section{display:none}
  section.active{display:block}

  /* TODAY */
  .today-empty{padding:30px;text-align:center;background:var(--panel);border:1px dashed var(--line);border-radius:var(--radius);color:var(--muted)}
  .today-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}

  /* CARDS */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
  .card .hdr{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .card h3{margin:0;font-size:16px}
  .card .meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .card textarea{min-height:80px}
  .actions{display:flex;flex-wrap:wrap;gap:6px}
  .checklist{display:flex;flex-direction:column;gap:4px;margin-top:2px}
  .checklist label{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--cream);cursor:pointer;padding:3px 0}
  .checklist input{accent-color:var(--gold);margin-top:3px}
  .checklist label.done{color:var(--muted);text-decoration:line-through}

  /* CALENDAR */
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
  .cal .day{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;min-height:140px}
  .cal .day.today{border-color:var(--gold);box-shadow:0 0 0 2px rgba(230,184,100,.15)}
  .cal .dlabel{font-size:12px;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between}
  .cal .dlabel .dnum{color:var(--cream);font-weight:600;font-size:15px}
  .cal .ev{font-size:12px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:4px 6px;margin-bottom:4px;cursor:pointer}
  .cal .ev:hover{border-color:var(--gold-dim)}
  .cal .ev .t{color:var(--gold);font-weight:600;margin-right:6px}
  .cal .ev.s-ready{border-left:3px solid var(--ok)}
  .cal .ev.s-review{border-left:3px solid var(--warn)}
  .cal .ev.s-draft{border-left:3px solid var(--gold-dim)}
  .cal .ev.s-published{opacity:.55;text-decoration:line-through}

  /* list */
  .post-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}

  /* settings */
  .setrow{display:grid;grid-template-columns:170px 1fr;gap:12px;align-items:center;margin-bottom:10px}
  .setrow label{color:var(--muted);font-size:13px}
  .help{font-size:12px;color:var(--muted);margin-top:6px}

  /* progress */
  .progress{height:6px;background:var(--bg2);border-radius:99px;overflow:hidden}
  .progress > div{height:100%;background:linear-gradient(90deg,var(--gold-dim),var(--gold));transition:.3s}

  /* media preview */
  .media-preview{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin:8px 0}
  .media-preview .mp-item{position:relative;background:var(--bg2);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;color:var(--muted);font-size:11px;text-decoration:none;transition:.15s}
  .media-preview .mp-item img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#000}
  .media-preview .mp-item:hover{border-color:var(--gold-dim)}
  .media-preview .mp-item .mp-num{position:absolute;top:4px;left:4px;background:rgba(0,0,0,.6);color:var(--gold);font-size:10px;padding:1px 6px;border-radius:99px;font-weight:600;z-index:2}
  .media-preview .mp-item .mp-caption{padding:6px 8px;font-size:11px;color:var(--cream);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
  .media-preview .mp-item .mp-sz{color:var(--muted)}
  .media-preview .mp-item .mp-sz.warn{color:var(--warn)}
  .mp-del,.cp-del{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.7);color:#fff;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;line-height:1;cursor:pointer;border:none;padding:0;z-index:3;transition:.15s}
  .mp-del:hover,.cp-del:hover{background:var(--danger);color:#1b160c}
  .field-hint{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.45}

  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  .modal-bg.show{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:960px;width:100%;max-height:92vh;overflow-y:auto;padding:22px;box-shadow:var(--shadow)}
  .modal h2{margin:0 0 10px}

  /* publish modal */
  .pm-head{display:flex;justify-content:space-between;gap:10px;margin-bottom:16px;align-items:flex-start}
  .pm-title{font-size:20px;font-weight:600;color:var(--gold);line-height:1.25}
  .pm-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;margin-bottom:16px}
  .pm-text-area{min-height:260px;font-size:14px;line-height:1.5;white-space:pre-wrap}
  .pm-cover{margin-bottom:10px;text-align:center}
  .pm-cover a{display:inline-block;border-radius:12px;overflow:hidden;border:1px solid var(--line);max-width:100%}
  .pm-cover a:hover{border-color:var(--gold-dim)}
  .pm-cover img{display:block;max-width:100%;max-height:280px;object-fit:contain}
  .pm-cover-cap{font-size:11px;color:var(--muted);margin-top:4px}
  .pm-media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;margin-bottom:10px}
  .pm-mi{position:relative;aspect-ratio:1;background:var(--bg2);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;text-align:center;padding:4px;text-decoration:none}
  .pm-mi img{width:100%;height:100%;object-fit:cover}
  .pm-mi:hover{border-color:var(--gold-dim)}
  .pm-mi-num{position:absolute;top:4px;left:4px;background:rgba(0,0,0,.65);color:var(--gold);font-size:10px;padding:1px 6px;border-radius:99px;font-weight:600;z-index:2}
  .pm-footer{display:flex;flex-wrap:wrap;gap:10px;align-items:center;border-top:1px solid var(--line);padding-top:14px}
  .pm-footer .spacer{flex:1}
  .btn.big{padding:11px 18px;font-size:15px}
  .pm-ig-publish-row{border-top:1px solid var(--line);padding-top:14px;margin-top:4px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .pm-ig-publish-row .field-hint{flex-basis:100%;margin:0}
  .pm-ig-status{margin-top:10px}
  .pm-ig-confirm-box,.pm-ig-loading,.pm-ig-ok,.pm-ig-err{border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.5}
  .pm-ig-confirm-box{background:var(--bg2);border:1px solid var(--gold)}
  .pm-ig-loading{background:var(--bg2);border:1px solid var(--line)}
  .pm-ig-ok{background:rgba(60,160,90,.14);border:1px solid #3ca05a}
  .pm-ig-ok a{color:var(--gold);font-weight:600}
  .pm-ig-err{background:rgba(200,74,58,.14);border:1px solid #c84a3a}
  @media (max-width:720px){
    .pm-grid{grid-template-columns:1fr}
    .pm-text-area{min-height:180px}
  }

  /* publish modal — tabs */
  .pm-tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 14px;flex-wrap:wrap}
  .pm-tabs button{background:transparent;border:none;color:var(--muted);padding:8px 14px;cursor:pointer;border-bottom:2px solid transparent;font-size:13px;font-weight:600}
  .pm-tabs button.active{color:var(--gold);border-bottom-color:var(--gold)}
  .pm-tabs button:hover{color:var(--cream)}
  .pm-platform-note{font-size:11px;color:var(--muted);margin-bottom:6px}

  /* PLATFORM chips */
  .platforms-row{display:flex;flex-wrap:wrap;gap:6px}
  .platform-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);background:var(--bg2);border-radius:99px;cursor:pointer;font-size:13px;color:var(--muted);user-select:none}
  .platform-chip input{margin:0;accent-color:var(--gold)}
  .platform-chip.on{border-color:var(--gold-dim);color:var(--gold);background:rgba(230,184,100,.08)}
  .platform-chip:hover{border-color:var(--gold-dim)}

  /* UPLOADER (drop-зона + клик для выбора) */
  .uploader{position:relative;border:2px dashed var(--line);border-radius:12px;padding:22px 18px;text-align:center;cursor:pointer;transition:.15s;background:var(--bg2);user-select:none;min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .uploader:hover{border-color:var(--gold-dim);background:rgba(230,184,100,.04)}
  .uploader.drag-over{border-color:var(--gold);background:rgba(230,184,100,.1)}
  .uploader.drag-over .uploader-title{color:var(--gold)}
  .uploader-icon{font-size:28px;line-height:1;margin-bottom:10px;color:var(--gold-dim)}
  .uploader-title{font-size:14px;color:var(--cream);font-weight:600;margin-bottom:4px}
  .uploader-sub{font-size:12px;color:var(--muted)}
  .uploader-sub b{color:var(--gold);font-weight:600}
  .uploader.uploading{pointer-events:none;border-color:var(--gold);background:rgba(230,184,100,.08);border-style:solid}
  .uploader.uploading .uploader-icon,
  .uploader.uploading .uploader-title,
  .uploader.uploading .uploader-sub{display:none}
  .uploader-status{display:none;flex-direction:column;align-items:center;gap:10px;color:var(--gold)}
  .uploader.uploading .uploader-status{display:flex}
  .uploader-status .spinner{width:30px;height:30px;border:3px solid rgba(230,184,100,.25);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
  .uploader-status .us-name{color:var(--cream);font-weight:600;font-size:14px}
  .uploader-status .us-prog{color:var(--muted);font-size:12px}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* Ghost-плитка для загружающегося файла */
  .mp-item.ghost,.file-card.ghost{position:relative;background:var(--bg2);border:1px solid var(--gold-dim);display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:11px;padding:10px;animation:pulse 1.4s ease-in-out infinite}
  .mp-item.ghost{aspect-ratio:1;flex-direction:column;gap:6px}
  .mp-item.ghost .spinner-sm{width:22px;height:22px;border:2px solid rgba(230,184,100,.25);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
  .mp-item.ghost .gh-name{color:var(--cream);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .file-card.ghost{padding:16px;gap:12px;justify-content:flex-start}
  .file-card.ghost .spinner-sm{width:30px;height:30px;border:3px solid rgba(230,184,100,.25);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;flex:0 0 auto}
  .file-card.ghost .gh-name{color:var(--cream);font-weight:600;font-size:14px}
  .file-card.ghost .gh-sub{color:var(--muted);font-size:12px;margin-top:2px}
  @keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}

  /* ===== Вкладка «Страницы» ===== */
  .pages-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:18px}
  .page-card{background:var(--bg2);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
  .page-head{position:relative;background:#000}
  .page-head .pc-cover-zone{position:relative;width:100%;aspect-ratio:2.7/1;background:linear-gradient(135deg,#2a2017,#1b160c);background-size:cover;background-position:center;cursor:pointer;transition:.15s}
  .page-head .pc-cover-zone.square{aspect-ratio:1/1;max-height:280px}
  .page-head .pc-cover-zone.wide{aspect-ratio:2.5/1}
  .page-head .pc-cover-zone.youtube{aspect-ratio:16/9;max-height:300px}
  .page-head .pc-cover-zone.no-cover{display:none}
  .page-head .pc-cover-zone.drag-over{outline:2px solid var(--gold);outline-offset:-2px}
  .page-head .pc-cover-empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);font-size:13px;gap:6px;text-align:center;padding:12px;background:rgba(0,0,0,.35)}
  .page-head .pc-cover-empty span{font-size:24px}
  .page-head .pc-cover-hint{position:absolute;left:12px;bottom:12px;background:rgba(0,0,0,.55);color:#fff;padding:4px 8px;border-radius:6px;font-size:11px;opacity:0;transition:.15s}
  .page-head .pc-cover-zone:hover .pc-cover-hint{opacity:1}
  .page-head .pc-cover-zone.drag-over .pc-cover-hint{opacity:1;background:var(--gold);color:#1b160c}
  .page-head .pc-cover-zone.uploading{outline:2px dashed var(--gold);outline-offset:-2px}
  .page-head .pc-cover-zone.uploading::after{content:"⏳ Загрузка…";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);color:var(--gold);font-weight:600}
  .page-head .pc-platform-pill{position:absolute;top:12px;right:12px;background:rgba(0,0,0,.55);color:#fff;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;display:flex;align-items:center;gap:6px}
  .page-head .pc-avatar-zone{position:absolute;left:18px;bottom:-36px;width:84px;height:84px;border-radius:50%;border:3px solid #1b160c;background:#2a2017;cursor:pointer;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:24px;transition:.15s}
  .page-head .pc-avatar-zone.no-head{position:relative;left:auto;bottom:auto;margin:14px 0 0 14px}
  .page-head .pc-avatar-zone.drag-over{border-color:var(--gold)}
  .page-head .pc-avatar-zone.uploading{outline:2px dashed var(--gold)}
  .page-head .pc-avatar-zone img{width:100%;height:100%;object-fit:cover}
  .page-head.no-cover{padding-bottom:14px}
  .page-body{padding:48px 18px 18px;display:flex;flex-direction:column;gap:12px}
  .page-card.no-cover .page-body{padding-top:14px}
  .page-row{display:flex;flex-direction:column;gap:4px}
  .page-row label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:6px}
  .page-row .char-counter{font-size:10px;color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0}
  .page-row .char-counter.over{color:#e07a5f;font-weight:600}
  .page-row input,.page-row textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--cream);font-size:14px;font-family:inherit;resize:vertical}
  .page-row textarea{min-height:60px;line-height:1.45}
  .page-row textarea.tall{min-height:100px}
  .page-row input:focus,.page-row textarea:focus{border-color:var(--gold-dim);outline:none}
  .page-actions{display:flex;flex-wrap:wrap;gap:8px;padding-top:4px;border-top:1px dashed var(--line);margin-top:4px;padding-top:12px}
  .page-actions .small-meta{flex:1;font-size:11px;color:var(--muted);align-self:center}

  .highlights-section{padding:0 18px 18px;display:flex;flex-direction:column;gap:10px}
  .highlights-section h4{margin:0;font-size:13px;color:var(--gold);text-transform:uppercase;letter-spacing:.6px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
  .highlights-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
  .highlight-tile{position:relative;aspect-ratio:1;background:var(--bg);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
  .highlight-tile:hover{border-color:var(--gold-dim)}
  .highlight-tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .highlight-tile .ht-label{position:relative;z-index:1;font-size:11px;color:#fff;background:linear-gradient(to top,rgba(0,0,0,.85),rgba(0,0,0,0));padding:14px 6px 6px;width:100%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .highlight-tile.empty{background:repeating-linear-gradient(45deg,var(--bg) 0 8px,var(--bg2) 8px 16px)}
  .highlight-tile .ht-actions{position:absolute;top:4px;right:4px;display:flex;gap:2px;opacity:0;transition:.15s;z-index:2}
  .highlight-tile:hover .ht-actions{opacity:1}
  .highlight-tile .ht-actions button{background:rgba(0,0,0,.7);color:#fff;border:none;border-radius:50%;width:22px;height:22px;font-size:11px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .highlight-tile .ht-actions button:hover{background:var(--gold);color:#1b160c}
  .highlight-add{aspect-ratio:1;background:transparent;border:2px dashed var(--line);color:var(--muted);border-radius:10px;cursor:pointer;font-size:24px;display:flex;align-items:center;justify-content:center;transition:.15s}
  .highlight-add:hover{border-color:var(--gold-dim);color:var(--gold)}

  .pages-empty{padding:28px;text-align:center;color:var(--muted);font-size:14px}
  .pages-banner{background:rgba(230,184,100,.08);border:1px solid var(--gold-dim);border-radius:12px;padding:12px 14px;margin-bottom:14px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--cream)}
  .pages-banner button{margin-left:auto}

  @media (max-width:720px){
    .pages-grid{grid-template-columns:1fr;gap:14px}
    .page-head .pc-cover-zone{aspect-ratio:2.2/1}
    .page-head .pc-cover-zone.youtube{aspect-ratio:16/9}
    .highlights-grid{grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
  }

  /* Карточка одного файла (для обложки) */
  .file-card{display:flex;gap:12px;align-items:center;padding:8px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;position:relative;margin-bottom:8px}
  .file-card .fc-thumb-wrap{position:relative;flex:0 0 auto;width:64px;height:64px}
  .file-card .fc-thumb{display:block;width:100%;height:100%;border-radius:8px;overflow:hidden;background:#000}
  .file-card .fc-thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .file-card .fc-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;padding-right:4px}
  .file-card .fc-name{font-size:14px;color:var(--cream);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .file-card .fc-size{font-size:12px;color:var(--muted)}
  .file-card .fc-size.warn{color:var(--warn)}
  .file-card .fc-thumb-wrap .cp-del{position:absolute;top:3px;right:3px;width:22px;height:22px;background:rgba(0,0,0,.75);color:#fff;border:none;display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;border-radius:50%;padding:0;line-height:1;z-index:3;transition:.15s}
  .file-card .fc-thumb-wrap .cp-del:hover{background:var(--danger);color:#1b160c}

  /* Ручная ссылка (свёрнутый блок) */
  .add-media-btn{margin-top:8px;width:100%;border:1px dashed var(--line);background:transparent;color:var(--muted);padding:10px;text-align:center}
  .add-media-btn:hover{border-color:var(--gold-dim);color:var(--gold);background:rgba(230,184,100,.04)}

  /* Вставить ссылку под зоной загрузки */
  .link-add{margin-top:6px}
  .link-add-toggle{border:none;background:transparent;color:var(--muted);font-size:12px;padding:4px 2px;cursor:pointer;font-family:inherit}
  .link-add-toggle:hover{color:var(--gold)}
  .link-add-row{display:flex;gap:8px;margin-top:6px;align-items:stretch}
  .link-add-row[hidden]{display:none}
  .link-add-input{flex:1;min-width:0;font-size:13px;padding:8px 10px}
  .link-add-go{flex:0 0 auto;border:1px solid var(--gold-dim);background:rgba(230,184,100,.08);color:var(--gold);border-radius:10px;padding:8px 14px;cursor:pointer;font-family:inherit;font-weight:600}
  .link-add-go:hover{background:var(--gold);color:#1b160c}

  /* ANYA focus mode */
  .anya-progress{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:14px}
  .anya-progress .progress{margin-top:8px}
  .anya-layout{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start}
  @media (max-width:900px){.anya-layout{grid-template-columns:1fr}}
  .anya-list{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px}
  /* Десктоп: списочный блок (details) выглядит как обычный sidebar без summary */
  details.anya-side{background:transparent;border:none;padding:0;border-radius:0}
  details.anya-side > summary{display:none}
  /* На десктопе показываем все дочерние элементы, даже если details не open
     (так первичный рендер без атрибута open остаётся видимым) */
  @media (min-width:721px){
    details.anya-side > .anya-add{display:flex !important}
    details.anya-side > .anya-list{display:block !important}
  }
  .anya-day{font-size:11px;color:var(--gold-dim);text-transform:uppercase;letter-spacing:.6px;padding:10px 10px 4px;font-weight:600}
  .anya-day:first-child{padding-top:6px}
  .anya-item{display:flex;gap:6px;align-items:center;padding:4px 8px 4px 10px;border-radius:8px;border-left:3px solid transparent;color:var(--cream);transition:.12s}
  .anya-item + .anya-item{margin-top:2px}
  .anya-item:hover{background:var(--bg2)}
  .anya-item.active{background:rgba(230,184,100,.1);border-left-color:var(--gold)}
  .anya-jump-area{display:flex;gap:10px;align-items:center;flex:1;background:transparent;border:none;padding:6px 0;cursor:pointer;font-family:inherit;text-align:left;color:inherit;min-width:0}
  .anya-item .ai-time{font-size:13px;color:var(--cream);font-weight:600;width:46px;flex:0 0 auto;font-variant-numeric:tabular-nums}
  .anya-item .ai-title{flex:1;font-size:13px;color:var(--cream);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.3}
  .anya-item .ai-status{font-size:14px;color:var(--muted);flex:0 0 auto;width:16px;text-align:center}
  .anya-item.filled .ai-status{color:var(--gold)}
  .anya-item.published{opacity:.55}
  .anya-item.published .ai-title{text-decoration:line-through}
  .anya-item{position:relative}
  .ai-del{display:none;width:22px;height:22px;border-radius:50%;background:transparent;border:none;color:var(--muted);cursor:pointer;align-items:center;justify-content:center;font-size:14px;padding:0;flex:0 0 auto}
  .ai-del:hover{background:rgba(224,122,95,.18);color:#ff8a72}
  .anya-item:hover .ai-status,.anya-item:focus-within .ai-status{display:none}
  .anya-item:hover .ai-del,.anya-item:focus-within .ai-del{display:flex}
  .anya-add{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-bottom:12px;padding:11px;border:1px solid var(--gold-dim);border-radius:10px;background:rgba(230,184,100,.06);color:var(--gold);cursor:pointer;font-family:inherit;font-size:14px;font-weight:600;transition:.15s}
  .anya-add:hover{background:rgba(230,184,100,.14);border-color:var(--gold)}
  .anya-trash{margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px}
  .anya-trash > summary{font-size:12px;color:var(--muted);padding:8px 10px;cursor:pointer;list-style:none;display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:.6px;font-weight:600}
  .anya-trash > summary::-webkit-details-marker{display:none}
  .anya-trash > summary::before{content:"▸";display:inline-block;transition:.15s;color:var(--muted)}
  .anya-trash[open] > summary::before{transform:rotate(90deg)}
  .anya-trash .anya-item{opacity:.55}
  .anya-trash .anya-item .ai-title{text-decoration:line-through}
  .ai-restore{display:none;width:22px;height:22px;border-radius:50%;background:transparent;border:none;color:var(--muted);cursor:pointer;align-items:center;justify-content:center;font-size:14px;padding:0;flex:0 0 auto}
  .ai-restore:hover{background:rgba(123,191,106,.18);color:var(--ok)}
  .anya-trash .anya-item:hover{opacity:1}
  .anya-trash .anya-item:hover .ai-status,.anya-trash .anya-item:hover .ai-del{display:none}
  .anya-trash .anya-item:hover .ai-restore{display:flex}
  .af-meta-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
  .af-dt-cell{display:flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:4px 10px}
  .af-dt-cell .dt-icon{font-size:14px;color:var(--gold-dim)}
  .af-dt-cell input{background:transparent;border:none;color:var(--cream);font-family:inherit;font-size:14px;padding:4px 0;color-scheme:dark;width:auto}
  .af-dt-cell input:focus{outline:none}
  .af-dt-cell input[type="date"]{min-width:130px}
  .af-dt-cell input[type="time"]{min-width:70px}
  .anya-focus{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow);max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
  .af-title{font-size:20px;font-weight:600;background:transparent;border:1px solid transparent;color:var(--gold);padding:6px 8px;border-radius:8px;width:100%}
  .af-title:hover{border-color:var(--line)}
  .af-title:focus{outline:none;border-color:var(--gold-dim);background:var(--bg2)}
  .af-label{font-size:13px;color:var(--muted);margin-bottom:6px}
  .af-block textarea{min-height:110px;font-size:15px;line-height:1.55}
  .af-block textarea[data-field="text"]{min-height:180px}
  .af-nav{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--line);padding-top:14px;margin-top:4px;flex-wrap:wrap}
  .af-counter{color:var(--muted);font-size:13px;text-align:center;flex:1}
  .af-empty{padding:40px;text-align:center;background:var(--panel);border:1px dashed var(--line);border-radius:var(--radius);color:var(--muted)}

  /* NOTES — техническая заметка Ани → Дмитрию (не публикуется) */
  .notes-block{background:rgba(230,197,98,.08);border:1px solid #7a6420;border-left:3px solid var(--gold);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
  .notes-block.filled{background:rgba(230,197,98,.14)}
  .notes-block .nb-label{font-size:12px;color:var(--warn);font-weight:600;text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:6px}
  .notes-block .nb-hint{font-size:12px;color:var(--muted);line-height:1.4}
  .notes-block textarea{min-height:60px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;font-size:14px;line-height:1.45;padding:8px 10px;color:var(--cream);font-family:inherit;resize:vertical}
  .notes-block textarea:focus{outline:none;border-color:var(--gold-dim)}
  .pm-notes{background:rgba(230,197,98,.14);border:1px solid #7a6420;border-left:3px solid var(--gold);border-radius:10px;padding:12px 14px;margin-bottom:14px}
  .pm-notes .pm-notes-label{font-size:12px;color:var(--warn);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
  .pm-notes .pm-notes-text{color:var(--cream);font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}

  /* LIGHTBOX */
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:60;padding:24px}
  .lightbox.show{display:flex}
  .lb-stage{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
  .lb-stage img,.lb-stage video{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;background:#000;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .lb-close{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.1);color:#fff;border:none;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;z-index:2}
  .lb-close:hover{background:var(--danger);color:#1b160c}
  .lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.08);color:#fff;border:none;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;z-index:2}
  .lb-nav:hover{background:rgba(230,184,100,.25);color:var(--gold)}
  .lb-prev{left:18px}.lb-next{right:18px}
  .lb-info{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.7);padding:8px 16px;border-radius:99px;color:#fff;font-size:13px;display:flex;align-items:center;gap:12px;max-width:90%}
  .lb-info .lb-name{color:var(--cream);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:300px}
  .lb-info .lb-size{color:var(--muted);font-size:12px}
  .lb-info a{color:var(--gold);text-decoration:none;font-size:12px}
  .lb-info a:hover{text-decoration:underline}
  .lb-action{background:transparent;border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:99px;padding:4px 12px;font-size:12px;cursor:pointer;transition:.15s;font-family:inherit}
  .lb-action:hover{background:var(--danger);color:#1b160c;border-color:var(--danger)}
  .lb-counter{position:absolute;top:16px;left:18px;background:rgba(0,0,0,.7);padding:6px 14px;border-radius:99px;color:var(--gold);font-size:13px;font-weight:600}
  .lb-spinner{color:var(--gold);font-size:14px}

  /* helpers */
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .small{font-size:12px;color:var(--muted)}
  details{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
  details summary{cursor:pointer;color:var(--muted);font-size:13px}

  @media (max-width:720px){
    .cal{grid-template-columns:repeat(2,1fr)}
    .setrow{grid-template-columns:1fr}
  }

  /* ========================================================
     MOBILE — нативная мобильная версия (≤ 720px)
     ======================================================== */
  @media (max-width:720px){
    /* — БАЗА — */
    html,body{font-size:15px;-webkit-text-size-adjust:100%}
    body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
    *{-webkit-tap-highlight-color:transparent}
    /* iOS не должен зумить при фокусе на инпуте: нужен ≥16px */
    textarea,input[type=text],input[type=url],input[type=date],input[type=time],select,.toolbar select{font-size:16px}
    /* основной wrap: убираем боковой паддинг, освобождаем место под нижний таб-бар */
    .wrap{padding:14px 14px calc(82px + env(safe-area-inset-bottom)) 14px}

    /* — ХЕДЕР — */
    header.top{margin-bottom:12px;gap:10px;align-items:center}
    .brand{gap:10px;flex:1;min-width:0}
    .brand .egg{height:40px}
    .brand h1{font-size:17px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .brand .sub{display:none}
    .stats{gap:6px;width:100%;display:grid;grid-template-columns:repeat(4,1fr)}
    .stat{min-width:0;padding:8px 6px;border-radius:10px;text-align:center}
    .stat .n{font-size:18px}
    .stat .l{font-size:9px;letter-spacing:.4px;line-height:1.2}

    /* — НИЖНИЙ ТАБ-БАР — */
    nav.tabs{
      position:fixed;
      left:0; right:0; bottom:0;
      z-index:40;
      background:rgba(15,13,10,.96);
      backdrop-filter:saturate(140%) blur(12px);
      -webkit-backdrop-filter:saturate(140%) blur(12px);
      border-top:1px solid var(--line);
      border-bottom:none;
      margin:0;
      padding:6px 4px calc(6px + env(safe-area-inset-bottom)) 4px;
      gap:0;
      overflow:visible;
      display:flex;
      justify-content:space-around;
      box-shadow:0 -2px 12px rgba(0,0,0,.5);
    }
    nav.tabs button{
      flex:1 1 0;
      min-width:0;
      padding:6px 2px 4px;
      font-size:10px;
      letter-spacing:.1px;
      border-bottom:none;
      border-top:2px solid transparent;
      color:var(--muted);
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:2px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      line-height:1.1;
      transition:color .15s,border-color .15s,background .15s;
    }
    nav.tabs button.active{
      color:var(--gold);
      border-top-color:var(--gold);
      border-bottom-color:transparent;
      background:rgba(230,184,100,.07);
    }
    /* Эмодзи-иконки сверху, текст под ними */
    nav.tabs button::before{
      display:block;
      font-size:20px;
      line-height:1;
      margin-bottom:2px;
    }
    nav.tabs button[data-tab="today"]::before{content:"📌"}
    nav.tabs button[data-tab="cal"]::before{content:"📅"}
    nav.tabs button[data-tab="all"]::before{content:"📋"}
    nav.tabs button[data-tab="anya"]::before{content:"✍️"}
    nav.tabs button[data-tab="pages"]::before{content:"🏠"}
    nav.tabs button[data-tab="settings"]::before{content:"⚙️"}
    nav.tabs button[data-tab="help"]::before{content:"❓"}

    /* — TOOLBAR — */
    .toolbar{
      gap:6px;
      margin-bottom:10px;
      flex-wrap:wrap;
      align-items:center;
    }
    .toolbar select{
      padding:8px 10px;
      flex:1 1 30%;
      min-width:0;
      max-width:none;
    }
    .toolbar .spacer{flex:1 1 100%; height:0; margin:0}
    .toolbar #connStatus{
      font-size:11px;
      padding:4px 10px;
      max-width:55%;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .toolbar #btnReload{padding:6px 10px;min-width:42px;min-height:38px}
    .toolbar #btnMediaFolder{padding:6px 10px;font-size:12px}
    .toolbar #btnAdd{padding:6px 12px;font-size:13px}

    /* — КАРТОЧКИ ПОСТОВ — */
    .today-grid,.post-grid{grid-template-columns:1fr;gap:12px}
    .card{padding:14px;gap:10px;border-radius:14px}
    .card h3{font-size:17px;line-height:1.3}
    .card .hdr{flex-direction:column;align-items:stretch;gap:8px}
    .card .hdr > div:last-child{align-self:stretch}
    .card .status-sel{width:100%;padding:9px 10px;font-size:14px}
    .card .meta{font-size:12px;gap:6px}
    .card textarea{font-size:15px;min-height:90px}

    /* Превью медиа: 3 в ряд */
    .media-preview{grid-template-columns:repeat(3,1fr);gap:6px}
    .pm-media-grid{grid-template-columns:repeat(3,1fr);gap:6px}

    /* Actions — кнопки крупные */
    .actions{gap:8px}
    .actions .btn{padding:11px 14px;font-size:14px;min-height:44px}
    .actions .publish-btn{flex:1 1 100%;justify-content:center;font-size:15px}
    .actions .copy-text{flex:1 1 calc(60% - 4px);justify-content:center}
    .actions .copy-tags{flex:1 1 calc(40% - 4px);justify-content:center}
    .actions .del-post{flex:0 0 auto}

    #sec-today h2{font-size:16px}

    /* — КАЛЕНДАРЬ: список по дням — */
    .cal{grid-template-columns:1fr; gap:8px}
    /* Скрываем заголовки дней недели (пн/вт/ср) — на мобильном вместо сетки список */
    .cal:first-of-type{display:none}
    .cal .day{min-height:0;padding:12px 14px;border-radius:12px}
    .cal .day .dlabel{
      font-size:13px;
      margin-bottom:8px;
      padding-bottom:6px;
      border-bottom:1px solid var(--line);
    }
    .cal .day .dlabel .dnum{font-size:18px;color:var(--gold)}
    .cal .day .ev{padding:8px 10px;font-size:13px;margin-bottom:6px}
    .cal .day .ev:last-child{margin-bottom:0}
    .cal .day .ev .t{font-size:13px;margin-right:8px}
    /* Дни без событий — скрываем (поддержка :has) */
    .cal .day:not(:has(.ev)){display:none}

    /* — ВКЛАДКА «АНЯ»: сворачиваемый список — */
    .anya-progress{padding:10px 12px;margin-bottom:10px}
    .anya-progress .row > div:first-child strong{font-size:14px}
    .anya-layout{grid-template-columns:1fr;gap:10px}
    .anya-side{order:1}
    .anya-main{order:2}

    /* На мобильном details.anya-side — кликабельный сворачиваемый блок */
    details.anya-side{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:12px;
      padding:0;
      overflow:hidden;
    }
    details.anya-side > summary{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:12px 14px;
      cursor:pointer;
      list-style:none;
      font-size:14px;
      color:var(--cream);
      font-weight:600;
      gap:10px;
      min-height:48px;
    }
    details.anya-side > summary::-webkit-details-marker{display:none}
    details.anya-side > summary::after{
      content:"▾";
      color:var(--gold);
      transition:transform .2s;
      font-size:14px;
    }
    details.anya-side[open] > summary::after{transform:rotate(180deg)}
    details.anya-side > summary:hover{color:var(--gold)}
    details.anya-side > .anya-list{
      max-height:55vh;
      overflow-y:auto;
      margin:0;
      border-radius:0;
      border:none;
      border-top:1px solid var(--line);
      padding:6px;
    }
    details.anya-side > .anya-add{
      margin:0;
      border-radius:0;
      border:none;
      border-top:1px solid var(--line);
      padding:14px;
      min-height:50px;
    }
    /* Делаем item-target крупнее для пальца */
    details.anya-side .anya-item{padding:6px 8px}
    details.anya-side .anya-item .ai-time{font-size:14px;width:50px}
    details.anya-side .anya-item .ai-title{font-size:14px}
    details.anya-side .anya-jump-area{padding:8px 0;min-height:36px}

    .anya-focus{padding:16px;gap:14px;max-width:100%;border-radius:14px}
    .af-title{font-size:18px;padding:8px 10px}
    .af-block textarea{font-size:15px;min-height:120px}
    .af-block textarea[data-field="text"]{min-height:200px}
    .af-meta-row{gap:6px}
    .af-meta-row .af-dt-cell{padding:6px 10px}
    .af-dt-cell input[type="date"]{min-width:115px;font-size:14px}
    .af-dt-cell input[type="time"]{min-width:60px;font-size:14px}
    .af-nav{gap:8px;padding-top:12px;flex-wrap:wrap}
    .af-nav .btn{padding:11px 14px;min-height:44px;font-size:14px;flex:1 1 0;min-width:0}
    .af-counter{flex:1 1 100%;order:3;font-size:13px;margin-top:6px}
    .platform-chip{padding:8px 12px;font-size:13px}

    /* — PUBLISH MODAL — full-screen sheet — */
    .modal-bg{padding:0;align-items:stretch;justify-content:stretch}
    .modal{
      max-width:100%;
      max-height:100%;
      height:100vh;
      height:100dvh;
      width:100%;
      border-radius:0;
      border:none;
      padding:14px 14px calc(80px + env(safe-area-inset-bottom)) 14px;
      box-shadow:none;
      display:flex;
      flex-direction:column;
      overflow-y:auto;
    }
    .pm-head{
      position:sticky;
      top:0;
      background:var(--panel);
      z-index:5;
      margin:-14px -14px 12px;
      padding:calc(14px + env(safe-area-inset-top)) 14px 12px;
      border-bottom:1px solid var(--line);
    }
    .pm-title{font-size:18px}
    .pm-tabs{margin-bottom:10px}
    .pm-tabs button{padding:9px 12px;font-size:13px;min-height:40px}
    .pm-grid{grid-template-columns:1fr;gap:14px;margin-bottom:14px}
    .pm-text-area{min-height:220px;font-size:15px}
    .pm-cover img{max-height:240px}
    .btn.big{padding:13px 16px;font-size:15px;min-height:48px}
    .pm-footer{
      position:sticky;
      bottom:0;
      left:0; right:0;
      background:linear-gradient(to top, var(--panel) 78%, rgba(31,26,20,.92) 100%);
      margin:auto -14px 0;
      padding:12px 14px calc(12px + env(safe-area-inset-bottom)) 14px;
      border-top:1px solid var(--line);
      gap:8px;
      flex-wrap:wrap;
      z-index:5;
    }
    .pm-footer .btn{flex:1 1 auto}
    .pm-footer .spacer{flex:1 1 100%;height:0}
    .pm-footer [data-mark-published],
    .pm-footer [data-mark-unpublish]{flex:1 1 100%}
    .pm-head .btn.ghost{padding:8px 14px;font-size:18px;min-width:44px;min-height:44px}

    /* Delete-confirm modal — на всю ширину */
    .modal > div[style*="max-width:480px"]{max-width:100%!important}

    /* — SETTINGS / HELP — */
    .setrow{grid-template-columns:1fr;gap:6px}
    .setrow label{font-size:12px;color:var(--muted)}
    #sec-settings .card,#sec-help .card{padding:14px;border-radius:12px}
    #sec-settings .card h3,#sec-help .card h3{font-size:16px;margin-top:0}
    #sec-help ol,#sec-help ul{padding-left:20px}
    #sec-help li{margin-bottom:6px;font-size:14px}

    /* — LIGHTBOX — */
    .lightbox{padding:0}
    .lb-close{
      top:calc(14px + env(safe-area-inset-top));
      right:14px;
      width:46px;
      height:46px;
      font-size:22px;
    }
    .lb-counter{
      top:calc(18px + env(safe-area-inset-top));
      left:14px;
    }
    .lb-nav{width:54px;height:54px;font-size:28px}
    .lb-prev{left:8px}
    .lb-next{right:8px}
    .lb-info{
      bottom:calc(18px + env(safe-area-inset-bottom));
      padding:8px 14px;
      font-size:12px;
      flex-wrap:wrap;
      gap:8px;
      max-width:calc(100% - 24px);
    }
    .lb-info .lb-name{max-width:60vw}

    /* — UPLOADER — */
    .uploader{padding:18px 14px;min-height:108px}
    .uploader-title{font-size:14px}
    .uploader-sub{font-size:13px}

    /* — FILE CARD (обложка) — */
    .file-card .fc-thumb-wrap{width:72px;height:72px}
    .file-card .fc-name{font-size:14px}
  }

  /* — Очень узкие экраны (≤ 380px) — */
  @media (max-width:380px){
    .stats{grid-template-columns:repeat(2,1fr)}
    .stat .l{font-size:10px}
    nav.tabs button{font-size:9px}
    nav.tabs button::before{font-size:18px}
    .brand h1{font-size:15px}
    .brand .egg{height:34px}
    .toolbar select{flex:1 1 45%}
  }

  /* — Альбомная (landscape) на телефоне — */
  @media (max-width:900px) and (orientation:landscape) and (max-height:500px){
    nav.tabs{padding:2px 4px calc(2px + env(safe-area-inset-bottom)) 4px}
    nav.tabs button{padding:4px 2px;font-size:9px}
    nav.tabs button::before{font-size:16px;margin-bottom:0}
    .wrap{padding-bottom:calc(58px + env(safe-area-inset-bottom))}
  }
  /* PIN overlay */
  .pin-overlay{position:fixed;inset:0;background:rgba(15,13,10,.92);backdrop-filter:blur(6px);z-index:9999;display:none;align-items:center;justify-content:center;padding:20px}
  .pin-overlay.show{display:flex}
  .pin-box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .pin-box h2{margin:0 0 6px;color:var(--gold);font-size:20px}
  .pin-box .pin-sub{color:var(--muted);font-size:13px;margin-bottom:18px}
  .pin-box input[type=password]{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;color:var(--txt);padding:12px 14px;font-size:18px;letter-spacing:4px;text-align:center;box-sizing:border-box}
  .pin-box input[type=password]:focus{outline:none;border-color:var(--gold-dim)}
  .pin-box .pin-err{color:var(--danger);font-size:13px;min-height:18px;margin:8px 0 0;text-align:center}
  .pin-box .pin-actions{margin-top:14px;display:flex;justify-content:flex-end}
  .pin-box .pin-actions .btn.primary{padding:9px 18px}
</style>
</head>

  <div class="pin-box">

    <div class="pin-sub">Доступ к пульту «Золотые яйца» защищён PIN-кодом.</div>
    <input id="pinInput" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="4" placeholder="••••">

    <div class="pin-actions">
      <button id="pinSubmit" class="btn primary" type="button">Войти</button>
    </div>
  </div>
</div>

const STATUS_CLASS = {draft:"", review:"warn", ready:"ok", published:"gold", deleted:"red"};
const VISIBLE_STATUSES = ["draft","review","ready","published"];

/* ===== STATE ===== */
const LS_KEY = "goldeneggs_dashboard_v1";
let state = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){
      const s = JSON.parse(raw);
      s.settings = Object.assign({}, DEFAULT_SETTINGS, s.settings||{});
      s.settings.links = Object.assign({}, DEFAULT_SETTINGS.links, s.settings.links||{});
      // backendUrl и mediaFolder теперь зашиты в коде — источник правды в DEFAULT_SETTINGS,
      // а не в localStorage (иначе старые сейвы со плейсхолдерами ломают подключение).
      s.settings.backendUrl = DEFAULT_SETTINGS.backendUrl;
      s.settings.mediaFolder = DEFAULT_SETTINGS.mediaFolder;
      if(!s.profiles) s.profiles = {};
      if(!Array.isArray(s.highlights)) s.highlights = [];
      return s;
    }
  }catch(e){}
  const posts = {};
  SEED_POSTS.forEach(p => { posts[p.id] = Object.assign({}, DEFAULT_FIELDS, p, {checks:Object.assign({},DEFAULT_FIELDS.checks)}); });
  return {posts, profiles:{}, highlights:[], settings:JSON.parse(JSON.stringify(DEFAULT_SETTINGS)), activeTab:"today"};
}
function saveState(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(_){} }

/* ===== ONLINE MODE (Google Sheets через Apps Script) ===== */
const isOnline = () => !!(state.settings && state.settings.backendUrl && /^https:\/\/script\.google\.com\//.test(state.settings.backendUrl));
function setConn(label, cls){
  const el = document.getElementById("connStatus");
  if(!el) return;
  el.textContent = label;
  el.className = "pill " + (cls||"");
}
async function api(payload){
  if(!isOnline()) throw new Error("Не задан URL бэкенда");
  const body = Object.assign({}, payload, { pin: state.settings.pin || "" });
  const res = await fetch(state.settings.backendUrl, {
    method:"POST",
    body: JSON.stringify(body),
    redirect:"follow"
  });
  let json;
  try { json = await res.json(); } catch(e){ throw new Error("Бэкенд вернул не JSON. Возможно, URL неверный или скрипт не развёрнут как Web app для всех."); }
  if(!json.ok){
    if(json.code === "PIN_REQUIRED"){
      state.settings.pin = "";
      saveState();
      showPinModal();
      throw new Error("Введите PIN");
    }
    throw new Error(json.error || "Ошибка бэкенда");
  }
  return json;
}

/* ===== PIN MODAL ===== */
function showPinModal(){
  const overlay = document.getElementById("pinOverlay");
  if(!overlay) return;
  overlay.classList.add("show");
  const inp = document.getElementById("pinInput");
  const err = document.getElementById("pinErr");
  if(err) err.textContent = "";
  if(inp){ inp.value = ""; setTimeout(()=>inp.focus(), 50); }
}
function hidePinModal(){
  const overlay = document.getElementById("pinOverlay");
  if(overlay) overlay.classList.remove("show");
}
async function submitPin(){
  const inp = document.getElementById("pinInput");
  const err = document.getElementById("pinErr");
  const btn = document.getElementById("pinSubmit");
  const val = (inp && inp.value || "").trim();
  if(!val){ if(err) err.textContent = "Введите PIN"; return; }
  if(!isOnline()){ if(err) err.textContent = "Не задан URL бэкенда"; return; }
  if(btn) btn.disabled = true;
  if(err) err.textContent = "Проверяем…";
  const prevPin = state.settings.pin;
  state.settings.pin = val;
  try{
    const res = await fetch(state.settings.backendUrl, {
      method:"POST",
      body: JSON.stringify({action:"ping", pin: val}),
      redirect:"follow"
    });
    let json;
    try { json = await res.json(); } catch(_){ throw new Error("Бэкенд вернул не JSON"); }
    if(json && json.ok){
      saveState();
      if(err) err.textContent = "";
      hidePinModal();
      loadFromBackend({silent:false});
    } else {
      state.settings.pin = prevPin;
      if(err) err.textContent = "Неверный PIN";
    }
  }catch(e){
    state.settings.pin = prevPin;
    if(err) err.textContent = "Ошибка: " + e.message;
  }finally{
    if(btn) btn.disabled = false;
  }
}
document.addEventListener("DOMContentLoaded", () => {
  const btn = document.getElementById("pinSubmit");
  const inp = document.getElementById("pinInput");
  if(btn) btn.addEventListener("click", submitPin);
  if(inp) inp.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); submitPin(); } });
});

async function loadFromBackend({silent=false}={}){
  if(!isOnline()){ setConn("🔌 Не подключено",""); return false; }
  setConn("⏳ Загрузка…","warn");
  const reloadBtn = document.getElementById("btnReload");
  if(reloadBtn) reloadBtn.classList.add("spin");
  try{
    const data = await api({action:"read"});
    const posts = {};
    (data.posts||[]).forEach(p => {
      const id = "row-"+p.rowIndex;
      const platforms = parsePlatforms(p.platforms);
      posts[id] = Object.assign({}, DEFAULT_FIELDS, p, {
        id,
        platforms: platforms.length ? platforms.join(", ") : (p.platforms || "Instagram"),
        platform: platforms[0] || "Instagram",  // обратная совместимость для старого кода
        checks: Object.assign({}, DEFAULT_FIELDS.checks, p.checks||{}),
        status: p.status || "draft"
      });
    });
    state.posts = posts;
    saveState();
    // Загрузить профили/highlights параллельно (не критично если упадёт)
    loadProfilesFromBackend({silent:true}).catch(()=>{});
    render();
    setConn("✓ Online · "+(Object.keys(posts).length)+" постов","ok");
    if(!silent) flash("Загружено из Google-таблицы");
    return true;
  }catch(err){
    setConn("⚠ "+err.message,"red");
    if(!silent) alert("Не удалось подключиться к таблице:\n\n"+err.message+"\n\nПроверьте URL в Настройках.");
    return false;
  }finally{
    if(reloadBtn) reloadBtn.classList.remove("spin");
  }
}

async function loadProfilesFromBackend({silent=true}={}){
  if(!isOnline()) return false;
  try{
    const data = await api({action:"readProfiles"});
    const profiles = {};
    (data.profiles||[]).forEach(p => {
      if(p && p.platform) profiles[p.platform] = p;
    });
    state.profiles = profiles;
    state.highlights = Array.isArray(data.highlights) ? data.highlights : [];
    saveState();
    if(typeof renderPages === "function") renderPages();
    if(!silent) flash("Загружены данные страниц");
    return true;
  }catch(err){
    if(!silent) flash("⚠ Профили: "+err.message);
    return false;
  }
}

const pendingProfile = new Map();
function pushProfile(platform, patch, debounceMs=400){
  if(!isOnline() || !platform) return;
  const cur = state.profiles[platform] || {platform};
  const merged = Object.assign({}, cur, patch);
  state.profiles[platform] = merged;
  saveState();
  if(pendingProfile.has(platform)) clearTimeout(pendingProfile.get(platform));
  const t = setTimeout(async () => {
    pendingProfile.delete(platform);
    try{
      setConn("⏳ Сохранение…","warn");
      const res = await api({action:"saveProfile", profile: state.profiles[platform]});
      if(res && res.profile && res.profile.updated_at){
        state.profiles[platform].updated_at = res.profile.updated_at;
        saveState();
      }
      setConn("✓ Сохранено","ok");
    }catch(err){
      setConn("⚠ "+err.message,"red");
    }
  }, debounceMs);
  pendingProfile.set(platform, t);
}

async function saveHighlightRemote(h){
  if(!isOnline()) throw new Error("Не подключено к Sheets");
  setConn("⏳ Сохранение…","warn");
  const res = await api({action:"saveHighlight", highlight: h});
  setConn("✓ Сохранено","ok");
  return res.highlight;
}

async function deleteHighlightRemote(id){
  if(!isOnline()) throw new Error("Не подключено к Sheets");
  setConn("⏳ Удаление…","warn");
  await api({action:"deleteHighlight", id});
  setConn("✓ Сохранено","ok");
}

const pending = new Map();
function pushField(rowIndex, field, value, debounceMs=600){
  if(!isOnline() || !rowIndex) return;
  const key = rowIndex+"|"+field;
  if(pending.has(key)) clearTimeout(pending.get(key));
  const t = setTimeout(async () => {
    pending.delete(key);
    try{
      setConn("⏳ Сохранение…","warn");
      await api({action:"update", rowIndex, field, value});
      setConn("✓ Сохранено","ok");
    }catch(err){
      setConn("⚠ "+err.message,"red");
    }
  }, debounceMs);
  pending.set(key, t);
}
async function pushCreate(post){
  if(!isOnline()) return null;
  setConn("⏳ Создание…","warn");
  try{
    const data = await api({action:"create", post});
    setConn("✓ Создано","ok");
    return data.rowIndex;
  }catch(err){ setConn("⚠ "+err.message,"red"); return null; }
}
async function pushDelete(rowIndex){
  if(!isOnline() || !rowIndex) return;
  setConn("⏳ Удаление…","warn");
  try{
    await api({action:"delete", rowIndex});
    setConn("✓ Удалено","ok");
  }catch(err){ setConn("⚠ "+err.message,"red"); }
}
function rowIndexOf(p){
  if(p && typeof p.rowIndex==="number") return p.rowIndex;
  if(p && typeof p.id==="string" && p.id.startsWith("row-")) return parseInt(p.id.substring(4),10);
  return null;
}

/* ===== Несохранённые изменения (ручное сохранение по кнопке) =====
   Автосейв убран, потому что при быстром редактировании дебаунс перебивался
   и часть текста терялась. Изменения копятся в dirty-сетах, отправляются
   единым нажатием «Сохранить» в карточке поста / на вкладке «Страницы». */
const dirtyPostFields = new Map();    // postId -> Set<field>
const dirtyProfileFields = new Map(); // platform -> Set<field>

function hasUnsavedChanges(){
  for(const s of dirtyPostFields.values()) if(s.size) return true;
  for(const s of dirtyProfileFields.values()) if(s.size) return true;
  return false;
}
function markPostDirty(id, field){
  if(!id) return;
  let s = dirtyPostFields.get(id);
  if(!s){ s = new Set(); dirtyPostFields.set(id, s); }
  s.add(field);
  updatePostSaveBtn(id);
}
function markProfileDirty(plat, field){
  if(!plat) return;
  let s = dirtyProfileFields.get(plat);
  if(!s){ s = new Set(); dirtyProfileFields.set(plat, s); }
  s.add(field);
  updateProfileSaveBtn(plat);
}
function saveBtnHtmlPost(id){
  const s = dirtyPostFields.get(id);
  const n = s ? s.size : 0;
  const dirty = n > 0;
  const label = dirty ? `💾 Сохранить${n>1?` (${n})`:""}` : "✓ Сохранено";
  return `<button class="btn save-btn${dirty?" dirty":""}" data-save-post="${id}" ${dirty?"":"disabled"}>${label}</button>`;
}
function saveBtnHtmlProfile(plat){
  const s = dirtyProfileFields.get(plat);
  const n = s ? s.size : 0;
  const dirty = n > 0;
  const label = dirty ? `💾 Сохранить${n>1?` (${n})`:""}` : "✓ Сохранено";
  return `<button class="btn save-btn${dirty?" dirty":""}" data-save-profile="${escape(plat)}" ${dirty?"":"disabled"}>${label}</button>`;
}
function updatePostSaveBtn(id){
  const s = dirtyPostFields.get(id);
  const n = s ? s.size : 0;
  const dirty = n > 0;
  const label = dirty ? `💾 Сохранить${n>1?` (${n})`:""}` : "✓ Сохранено";
  document.querySelectorAll(`[data-save-post="${id}"]`).forEach(btn => {
    btn.classList.toggle("dirty", dirty);
    btn.disabled = !dirty;
    btn.textContent = label;
  });
}
function updateProfileSaveBtn(plat){
  const s = dirtyProfileFields.get(plat);
  const n = s ? s.size : 0;
  const dirty = n > 0;
  const label = dirty ? `💾 Сохранить${n>1?` (${n})`:""}` : "✓ Сохранено";
  document.querySelectorAll(`[data-save-profile="${plat}"]`).forEach(btn => {
    btn.classList.toggle("dirty", dirty);
    btn.disabled = !dirty;
    btn.textContent = label;
  });
}
async function savePost(id){
  const p = state.posts[id]; if(!p) return;
  const fields = dirtyPostFields.get(id);
  if(!fields || !fields.size) return;
  if(!isOnline()){ flash("⚠ Нет подключения к Sheets"); return; }
  const ri = rowIndexOf(p);
  if(!ri){ flash("⚠ Пост ещё не создан в таблице"); return; }
  const btns = Array.from(document.querySelectorAll(`[data-save-post="${id}"]`));
  btns.forEach(b => { b.disabled = true; b.textContent = "⏳ Сохранение…"; });
  setConn("⏳ Сохранение…","warn");
  const toSave = Array.from(fields);
  try{
    for(const f of toSave){
      await api({action:"update", rowIndex: ri, field: f, value: p[f]});
      fields.delete(f);
    }
    if(!fields.size) dirtyPostFields.delete(id);
    setConn("✓ Сохранено","ok");
    flash("Сохранено");
  } catch(err){
    setConn("⚠ "+err.message,"red");
    flash("⚠ Не сохранилось: "+err.message);
  } finally {
    updatePostSaveBtn(id);
  }
}
async function saveProfileNow(plat){
  const fields = dirtyProfileFields.get(plat);
  if(!fields || !fields.size) return;
  if(!isOnline()){ flash("⚠ Нет подключения к Sheets"); return; }
  if(!state.profiles[plat]) state.profiles[plat] = {platform: plat};
  const btns = Array.from(document.querySelectorAll(`[data-save-profile="${plat}"]`));
  btns.forEach(b => { b.disabled = true; b.textContent = "⏳ Сохранение…"; });
  setConn("⏳ Сохранение…","warn");
  try{
    const res = await api({action:"saveProfile", profile: state.profiles[plat]});
    if(res && res.profile && res.profile.updated_at){
      state.profiles[plat].updated_at = res.profile.updated_at;
      saveState();
    }
    dirtyProfileFields.delete(plat);
    setConn("✓ Сохранено","ok");
    flash("Сохранено");
  } catch(err){
    setConn("⚠ "+err.message,"red");
    flash("⚠ Не сохранилось: "+err.message);
  } finally {
    updateProfileSaveBtn(plat);
  }
}

/* ===== HELPERS ===== */
const $ = sel => document.querySelector(sel);
const $$ = sel => Array.from(document.querySelectorAll(sel));
const RU_DOW = ["вс","пн","вт","ср","чт","пт","сб"];
const RU_MON = ["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"];
function pad(n){return String(n).padStart(2,"0")}
function fmtDateTime(iso){
  if(!iso) return "—";
  const d = new Date(iso);
  return `${pad(d.getDate())} ${RU_MON[d.getMonth()]}, ${RU_DOW[d.getDay()]} · ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function isoDate(iso){ if(!iso) return ""; return iso.substring(0,10); }
function todayISO(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function listPosts(){ return Object.values(state.posts).filter(p => p.status !== "deleted").sort((a,b)=> (a.datetime||"").localeCompare(b.datetime||"")); }
function deletedPosts(){ return Object.values(state.posts).filter(p => p.status === "deleted").sort((a,b)=> (a.datetime||"").localeCompare(b.datetime||"")); }
function applyFilters(posts){
  const fp = $("#filterPlatform").value, fs = $("#filterStatus").value, fm = $("#filterMode").value;
  return posts.filter(p => (!fp || p.platform===fp) && (!fs || p.status===fs) && (!fm || p.mode===fm));
}
function copy(text){ navigator.clipboard.writeText(text).then(()=>flash("Скопировано")); }
function flash(msg){
  const el=document.createElement("div");
  el.textContent=msg;
  el.style.cssText="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--gold);color:#1b160c;padding:8px 16px;border-radius:99px;font-weight:600;z-index:100;box-shadow:0 6px 18px rgba(0,0,0,.4)";
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),1400);
}

  updateMediaFolderBtn();
  $("#brandSub").textContent = (state.settings.tagline||"") + " · единое окно для Дмитрия и Ани";
}
function updateMediaFolderBtn(){
  const btn = document.getElementById("btnMediaFolder");
  if(!btn) return;
  const url = (state.settings.mediaFolder||"").trim();
  if(url){ btn.href = url; btn.style.display = ""; }
  else { btn.removeAttribute("href"); btn.style.display = "none"; }
}

function renderStats(){
  const posts = listPosts();
  const today = todayISO();
  const todays = posts.filter(p => isoDate(p.datetime)===today);
  const ready = posts.filter(p => p.status==="ready" || p.status==="published").length;
  const published = posts.filter(p => p.status==="published").length;
  const draft = posts.filter(p => p.status==="draft").length;
  $("#statsBox").innerHTML = `
    <div class="stat"><div class="n">${todays.length}</div><div class="l">на сегодня</div></div>
    <div class="stat"><div class="n">${posts.length}</div><div class="l">всего постов</div></div>
    <div class="stat"><div class="n">${ready}/${posts.length}</div><div class="l">готовы / опубл.</div></div>
    <div class="stat"><div class="n">${draft}</div><div class="l">в черновике</div></div>
  `;
}

function renderFilters(){
  const platforms = [...new Set(listPosts().map(p=>p.platform))];
  const modes = [...new Set(listPosts().map(p=>p.mode).filter(Boolean))];
  const fp = $("#filterPlatform"), fm = $("#filterMode");
  const fpv = fp.value, fmv = fm.value;
  fp.innerHTML = `<option value="">Все площадки</option>` + platforms.map(p=>`<option ${p===fpv?"selected":""}>${p}</option>`).join("");
  fm.innerHTML = `<option value="">Все типы</option>` + modes.map(m=>`<option ${m===fmv?"selected":""}>${m}</option>`).join("");
}

function buildFullText(p){
  const tags = (p.hashtags || state.settings.baseHashtags || "").trim();
  return (p.text||"").trim() + (tags?("\n\n"+tags):"");
}
function escape(s){ return String(s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }

/* ===== MEDIA PREVIEW ===== */
const DRIVE_ID_RE = /\/file\/d\/([a-zA-Z0-9_-]{10,})|[?&]id=([a-zA-Z0-9_-]{10,})|\/d\/([a-zA-Z0-9_-]{10,})/;
function extractDriveId(url){
  const m = String(url||"").match(DRIVE_ID_RE);
  return m && (m[1]||m[2]||m[3]);
}
function mediaPreviewUrl(url){
  const u = String(url||"").trim().split("#")[0];
  if(!u) return null;
  const id = extractDriveId(u);
  if(id) return `https://drive.google.com/thumbnail?id=${id}&sz=w400`;
  if(/^https?:\/\/.+\.(jpe?g|png|gif|webp|avif|bmp)(\?.*)?$/i.test(u)) return u;
  return null;
}
/* Метаданные файла (имя, размер) хранятся в URL fragment: ...#n=name&s=12345
   Sheets/Drive хранят полный URL, fragment Drive игнорирует — обратно совместимо. */
function parseMediaUrl(raw){
  if(!raw) return null;
  const u = String(raw).trim();
  if(!u) return null;
  const out = {url:u, name:"", size:0};
  const hi = u.indexOf("#");
  if(hi > 0){
    u.slice(hi+1).split("&").forEach(kv => {
      const i = kv.indexOf("=");
      const k = i>=0 ? kv.slice(0,i) : kv;
      const v = i>=0 ? kv.slice(i+1) : "";
      if(k === "n"){ try { out.name = decodeURIComponent(v.replace(/\+/g," ")); } catch(_){ out.name = v; } }
      if(k === "s"){ out.size = parseInt(v,10)||0; }
    });
  }
  return out;
}
function withMeta(url, name, size){
  if(!url) return "";
  const base = String(url).split("#")[0];
  const parts = [];
  if(name) parts.push("n=" + encodeURIComponent(name));
  if(size) parts.push("s=" + size);
  return parts.length ? (base + "#" + parts.join("&")) : base;
}
function fmtSize(bytes){
  if(!bytes || bytes<=0) return "";
  if(bytes < 1024) return bytes + " Б";
  if(bytes < 1024*1024) return Math.round(bytes/1024) + " КБ";
  return (bytes/1024/1024).toFixed(bytes < 10*1024*1024 ? 1 : 0) + " МБ";
}
function fileLabel(item){
  // item — объект из parseMediaUrl
  if(!item) return "";
  if(item.name) return item.name;
  const id = extractDriveId(item.url);
  return id ? "Файл из Drive" : "Внешняя ссылка";
}
function sizeWarn(bytes){
  // подсказка «норм / тяжеловат» для Аниного восприятия
  if(!bytes) return "";
  if(bytes > 30*1024*1024) return "⚠ очень тяжёлый";
  if(bytes > 10*1024*1024) return "тяжеловат";
  return "";
}
function parseMediaList(s){
  return String(s||"").split(/\n+/).map(x=>x.trim()).filter(Boolean).map(parseMediaUrl);
}
function serializeMediaList(items){
  return (items||[]).map(it => typeof it === "string" ? it : it.url).filter(Boolean).join("\n");
}
function renderMediaPreview(list){
  if(!list || !list.length){
    return ""; // пусто — ничего не рисуем, uploader сам приглашает
  }
  return `<div class="media-preview">${list.map((it,i)=>{
    const prev = mediaPreviewUrl(it.url);
    const name = fileLabel(it);
    const sz = fmtSize(it.size);
    const warn = sizeWarn(it.size);
    const caption = [escape(name), sz?`<span class="mp-sz ${warn?'warn':''}">${escape(sz)}${warn?` · ${escape(warn)}`:''}</span>`:""].filter(Boolean).join(" · ");
    const inner = prev
      ? `<img src="${escape(prev)}" loading="lazy" onerror="this.style.display='none';this.parentElement.appendChild(Object.assign(document.createElement('span'),{textContent:'нет превью'}))">`
      : `<span>файл ${i+1}</span>`;
    return `<a class="mp-item" href="${escape(it.url)}" target="_blank" rel="noopener" title="${escape(name)} · ${escape(it.url)}">
      <span class="mp-num">${i+1}</span>
      <button class="mp-del" data-mp-del="${i}" title="Убрать">✕</button>
      ${inner}
      <span class="mp-caption">${caption}</span>
    </a>`;
  }).join("")}</div>`;
}
function renderCoverPreview(value){
  const it = parseMediaUrl(value);
  if(!it) return "";
  const prev = mediaPreviewUrl(it.url);
  if(!prev) return "";
  const name = fileLabel(it);
  const sz = fmtSize(it.size);
  const warn = sizeWarn(it.size);
  return `<div class="file-card">
    <span class="fc-thumb-wrap">
      <a class="fc-thumb" href="${escape(it.url)}" rel="noopener" title="Открыть превью"><img src="${escape(prev)}" loading="lazy" onerror="this.parentElement.style.background='#222'"></a>
      <button class="cp-del" data-cp-del title="Убрать обложку">✕</button>
    </span>
    <div class="fc-info">
      <div class="fc-name" title="${escape(name)}">${escape(name)}</div>
      <div class="fc-size ${warn?'warn':''}">${escape(sz)}${warn?` · ${escape(warn)}`:""}</div>
    </div>
  </div>`;
}

function buildFullTextFor(p, plat){

async function downloadMediaZip(p, plat, btn){
  if(!isOnline()){ alert("Сначала подключите бэкенд в Настройках"); return; }
  const c = contentForPlatform(p, plat);
  const urls = [];
  if(c.cover) urls.push(String(c.cover).split("#")[0]);
  parseMediaList(c.media).forEach(it => { if(it && it.url) urls.push(String(it.url).split("#")[0]); });
  if(!urls.length){ alert("В этом посте нет файлов для архивации"); return; }

  const originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = "Собираем архив… (это может занять до минуты)";
  try{
    const stem = (p.title || "post").trim() + "-" + plat;
    const res = await api({ action:"zipMedia", urls: urls, filename: stem, folderUrl: state.settings.mediaFolder || "" });
    if(!res || !res.ok){ throw new Error((res && res.error) || "Бэкенд не вернул архив"); }
    window.open(res.url, "_blank", "noopener");
    let msg = `✓ Архив готов · ${res.count}/${res.requested}`;
    if(res.skipped && res.skipped.length) msg += " · пропущено: " + res.skipped.length;
    flash(msg);
  }catch(err){
    alert("Не удалось скачать архив: " + (err && err.message || err));
  }finally{
    btn.disabled = false;
    btn.textContent = originalText;
  }
}

/* TODAY */
function renderToday(){
  const today = todayISO();

  const list = all.filter(p => isoDate(p.datetime)===today);
  const root = $("#sec-today");
  const premiereLine = state.settings.premiere ? premiereCountdown(state.settings.premiere) : "";
  let html = premiereLine;
  if(list.length){
    html += `<h2 style="margin:8px 0 12px;font-size:18px">📌 Сегодня публикуем (${list.length})</h2>`;
    html += `<div class="today-grid">${list.map(postCard).join("")}</div>`;
  } else {
    html += `<div class="today-empty" style="margin-bottom:18px">На сегодня публикаций не запланировано 🎉<br><span class="small">Самое время подготовить материалы на ближайшие дни ↓</span></div>`;
  }
  // upcoming (next 7 days, exclude today)
  const upcoming = all.filter(p => {
    const d = isoDate(p.datetime);
    if(!d || d<=today) return false;
    const diff = (new Date(d) - new Date(today))/(1000*60*60*24);
    return diff<=7;
  });
  if(upcoming.length){
    html += `<h2 style="margin:18px 0 12px;font-size:18px">⏭ Ближайшие 7 дней (${upcoming.length})</h2>`;
    html += `<div class="today-grid">${upcoming.map(postCard).join("")}</div>`;
  } else if(!list.length){
    html += `<div class="today-empty">В ближайшую неделю постов в расписании нет.<br><span class="small">Загляните во вкладку «Все посты», чтобы увидеть полный список.</span></div>`;
  }
  root.innerHTML = html;
}
function premiereCountdown(dateStr){
  const t = new Date(dateStr+"T00:00:00");
  const now = new Date(); now.setHours(0,0,0,0);
  const diff = Math.round((t-now)/(1000*60*60*24));
  let msg;
  if(diff>1) msg = `🎬 До премьеры — ${diff} ${plural(diff,"день","дня","дней")}`;
  else if(diff===1) msg = `🎬 До премьеры — завтра!`;
  else if(diff===0) msg = `🔥 Премьера сегодня!`;
  else msg = `Премьера состоялась ${Math.abs(diff)} ${plural(Math.abs(diff),"день","дня","дней")} назад`;
  return `<div style="background:linear-gradient(90deg,rgba(230,184,100,.15),transparent);border:1px solid var(--gold-dim);border-radius:12px;padding:12px 16px;margin-bottom:14px;color:var(--gold);font-weight:600">${msg}</div>`;
}
function plural(n,one,few,many){ n=Math.abs(n)%100; const n1=n%10; if(n>10&&n<20) return many; if(n1>1&&n1<5) return few; if(n1===1) return one; return many; }

  if(!posts.length){ $("#sec-cal").innerHTML = "<div class='today-empty'>Постов нет</div>"; return; }
  const dates = posts.map(p => isoDate(p.datetime)).filter(Boolean);
  if(!dates.length){ $("#sec-cal").innerHTML = "<div class='today-empty'>Нет дат</div>"; return; }
  const min = new Date(dates.reduce((a,b)=>a<b?a:b)+"T00:00:00");
  const max = new Date(dates.reduce((a,b)=>a>b?a:b)+"T00:00:00");
  // align min to Monday
  const startDow = (min.getDay()+6)%7; min.setDate(min.getDate()-startDow);
  const days = [];
  const cursor = new Date(min);
  while(cursor<=max || days.length%7!==0){
    days.push(new Date(cursor));
    cursor.setDate(cursor.getDate()+1);
    if(days.length>56) break;
  }
  const byDate = {};
  posts.forEach(p => { const d = isoDate(p.datetime); if(!d) return; (byDate[d]=byDate[d]||[]).push(p); });
  const today = todayISO();
  const headers = ["пн","вт","ср","чт","пт","сб","вс"].map(d=>`<div class="dlabel" style="text-align:center;background:transparent">${d}</div>`).join("");
  const cells = days.map(d => {
    const ds = `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    const evs = (byDate[ds]||[]).sort((a,b)=>(a.datetime||"").localeCompare(b.datetime||""));
    const isToday = ds===today;
    return `<div class="day ${isToday?'today':''}">
      <div class="dlabel"><span class="dnum">${d.getDate()}</span><span>${RU_MON[d.getMonth()].slice(0,3)}</span></div>
      ${evs.map(p=>`<div class="ev s-${p.status}" data-jump="${p.id}"><span class="t">${(p.datetime||"").substring(11,16)}</span>${escape(p.title)}</div>`).join("")}
    </div>`;
  }).join("");
  $("#sec-cal").innerHTML = `<div class="cal" style="grid-template-columns:repeat(7,1fr);margin-bottom:8px">${headers}</div><div class="cal">${cells}</div>`;
}

/* ANYA — focus mode */
function isAnyaFilled(p){
  const hasText = !!(p.text && p.text.trim());
  const hasMedia = !!(p.cover && p.cover.trim()) || parseMediaList(p.media).length>0;
  return hasText && hasMedia;
}
function anyaPosts(){
  return listPosts().filter(p => p.status !== "published");
}
function nextUnfilledId(currentId){
  const posts = anyaPosts();
  if(!posts.length) return null;
  const idx = currentId ? posts.findIndex(p=>p.id===currentId) : -1;
  for(let i=idx+1;i<posts.length;i++){ if(!isAnyaFilled(posts[i])) return posts[i].id; }
  for(let i=0;i<idx;i++){ if(!isAnyaFilled(posts[i])) return posts[i].id; }
  return null;
}

/* Обновление прогресса и полоски без перерисовки карточки (чтобы фокус в textarea не терялся) */
function updateAnyaProgressLight(){
  const root = $("#sec-anya");
  if(!root || !root.classList.contains("active")) return;
  const posts = anyaPosts();
  if(!posts.length) return;
  const filled = posts.filter(isAnyaFilled).length;
  const pct = posts.length ? Math.round(filled/posts.length*100) : 0;
  const allDone = filled === posts.length;
  const prog = document.getElementById("anyaProgress");
  if(prog){
    const label = prog.querySelector("strong");
    if(label) label.textContent = allDone ? "🎉 Все посты заполнены!" : `Заполнено ${filled} из ${posts.length}`;
    const small = prog.querySelector(".small");
    if(small) small.textContent = pct+"%";
    const bar = prog.querySelector(".progress > div");
    if(bar) bar.style.width = pct+"%";
  }
  const list = document.getElementById("anyaList");
  if(list){
    posts.forEach(x => {
      const jumpBtn = list.querySelector(`.anya-jump-area[data-anya-jump="${x.id}"]`);
      const item = jumpBtn && jumpBtn.closest(".anya-item");
      if(!item) return;
      const d = x.datetime ? new Date(x.datetime) : null;
      const hhmm = d ? `${pad(d.getHours())}:${pad(d.getMinutes())}` : "—";
      const filled = isAnyaFilled(x);
      const timeEl = item.querySelector(".ai-time");
      const titleEl = item.querySelector(".ai-title");
      const statusEl = item.querySelector(".ai-status");
      if(timeEl) timeEl.textContent = hhmm;
      if(titleEl) titleEl.textContent = x.title || "(без названия)";
      if(statusEl) statusEl.textContent = x.status==="published" ? "🚀" : (filled ? "✓" : "○");
      item.classList.toggle("filled", filled);
      item.classList.toggle("published", x.status==="published");
      item.title = x.title || "(без названия)";
    });
  }
}

function buildProfileCopyText(plat){
  const p = profileFor(plat);
  const parts = [];
  if(p.display_name) parts.push(p.display_name);
  if(p.handle) parts.push(p.handle);
  if(p.bio) parts.push("\n" + p.bio);
  if(p.link_in_bio) parts.push("\n🔗 " + p.link_in_bio);
  if(p.extra_links) parts.push(p.extra_links);
  if(p.description) parts.push("\n" + p.description);
  return parts.join("\n").trim();
}
